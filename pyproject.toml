[project]
name = "meridian"
version = "0.1.0"
description = "Local-first personal knowledge assistant grounded in Gmail, Calendar, Docs, and local notes/transcripts."
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
