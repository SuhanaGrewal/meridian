[project]
name = "meridian"
version = "0.1.0"
description = "Local-first personal knowledge assistant grounded in Gmail, Calendar, Docs, and local notes/transcripts."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "python-dotenv>=1.0",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.100",
    "cryptography>=43.0",
    "presidio-analyzer>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
